<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>System article · Memory systems assessments</title>
<style>
:root{color-scheme:light;--ink:#182522;--muted:#5d706a;--line:#dbe5df;--accent:#166653;--paper:#f6f8f5}*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,sans-serif}main{width:min(1040px,calc(100% - 36px));margin:36px auto 72px}a{color:var(--accent);text-underline-offset:3px;overflow-wrap:anywhere}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.08;letter-spacing:-.035em;margin:.25em 0}h2{margin:30px 0 8px;font-size:1.4rem}h3{margin:16px 0 6px}.eyebrow,.meta{color:var(--muted);font-size:.92rem}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}.status{display:inline-block;padding:3px 10px;border-radius:999px;background:#edf3ef;color:#355c4d;margin:4px 6px 4px 0;font-size:.9rem}.status.not_run{background:#faf3dc;color:#775e19}.summary{font-size:1.1rem;color:#354843}.jump,.article-nav{display:flex;gap:12px;flex-wrap:wrap;padding:12px 0}.jump a,.article-nav a{padding:6px 10px;background:white;border:1px solid var(--line);border-radius:8px}.metric{border-top:1px solid var(--line);padding:12px 0}.metric:first-child{border-top:0}.sources li{margin:8px 0}.note{border-left:3px solid #98bba9;background:#edf3ef;padding:12px 14px;color:#435c51}@media(max-width:600px){main{margin-top:20px}.panel{padding:14px}}
</style>
</head>
<body><main id="article"><p class="note">Loading system article…</p></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isExternalWebLink=url=>typeof url==='string'&&(url.slice(0,7).toLowerCase()==='http://'||url.slice(0,8).toLowerCase()==='https://');
const webLink=(url,label)=>'<a href="'+esc(url)+'"'+(isExternalWebLink(url)?' target="_blank" rel="noopener noreferrer"':'')+'>'+label+(isExternalWebLink(url)?'<span class="sr-only"> (opens in a new tab)</span>':'')+'</a>';
const sourceLink=(ids,sources)=>ids.map(id=>{const s=sources.find(x=>x.id===id);return s?webLink(s.url,esc(s.label)):esc(id)}).join('; ');
const paras=(items,sources)=>items.map(x=>'<p>'+esc(x.text)+' <span class="meta">Evidence: '+sourceLink(x.sources||[],sources)+'</span></p>').join('');
fetch('./data/system-articles.json').then(r=>{if(!r.ok)throw Error('Could not load system articles');return r.json()}).then(data=>{
 const slug=new URLSearchParams(location.search).get('id');
 const article=(data.articles||[]).find(x=>x.slug===slug);
 const root=document.querySelector('#article');
 if(!article){root.innerHTML='<p class="note">Article not found. <a href="./index.html">Return to the system catalog</a>.</p>';return}
 document.title=article.name+' · System article';
 const sourceStatus=article.source_status==='reviewed_from_code'?'Reviewed from code':'Source review status: '+article.source_status;
 const nav=(data.articles||[]).map(x=>'<a href="./system.html?id='+encodeURIComponent(x.slug)+'">'+esc(x.name)+'</a>').join('');
 root.innerHTML='<nav class="article-nav" aria-label="Article navigation"><a href="./index.html">← Catalog</a>'+nav+'</nav>'+
 '<header><p class="eyebrow">PROJECT SOURCE REVIEW · PINNED UPSTREAM REVISION</p><h1>'+esc(article.name)+'</h1><p class="summary">'+esc(article.summary)+'</p>'+
 '<p><span class="status">'+esc(sourceStatus)+'</span><span class="status not_run">'+esc(article.benchmark_status==='not_run'?'Benchmark not run':'Benchmark status: '+article.benchmark_status)+'</span></p>'+
 '<p class="meta">Repository: '+webLink(article.repository,esc(article.repository))+' · default branch '+esc(article.branch)+' · reviewed '+esc(article.reviewed_at)+' '+esc(article.review_timezone)+' · commit '+webLink(article.repository.replace(/\/$/,'')+'/commit/'+article.revision,'<code>'+esc(article.revision)+'</code>')+'</p></header>'+
 '<nav class="jump" aria-label="Page sections">'+['who','architecture','behavior','metrics','limits','benchmark','sources'].map(id=>'<a href="#'+id+'">'+({who:'Who / what',architecture:'Architecture and data',behavior:'Operations',metrics:'Metric evidence',limits:'Limits',benchmark:'Benchmark status',sources:'Sources'}[id])+'</a>').join('')+'</nav>'+
 '<section id="who" class="panel"><h2>Who and what</h2>'+paras(article.who_what,article.sources)+'</section>'+
 '<section id="architecture" class="panel"><h2>Architecture and data model</h2>'+paras(article.architecture,article.sources)+'</section>'+
 '<section id="behavior" class="panel"><h2>Write, update, delete, and retrieval</h2>'+paras(article.behavior,article.sources)+'</section>'+
 '<section id="metrics" class="panel"><h2>Metric-domain evidence</h2><p class="meta">Source inspection describes code paths. It does not establish workload outcomes. Project metric definitions are linked per row.</p>'+
 article.metrics.map(m=>'<div class="metric"><strong>'+esc(m.domain)+'</strong> · '+esc(m.status)+'<p>'+esc(m.evidence)+'</p><span class="meta">Evidence: '+sourceLink(m.sources||[],article.sources)+'</span></div>').join('')+'</section>'+
 '<section id="limits" class="panel"><h2>Limits and unknowns</h2>'+paras(article.limits,article.sources)+'</section>'+
 '<section id="benchmark" class="panel"><h2>Benchmark status</h2>'+paras(article.benchmark,article.sources)+'</section>'+
 '<section id="sources" class="panel"><h2>Sources</h2><ul class="sources">'+article.sources.map(s=>'<li>'+webLink(s.url,esc(s.label))+' <span class="meta">('+esc(s.path||'project source')+(s.symbol?' · '+esc(s.symbol):'')+')</span></li>').join('')+'</ul>'+
 (article.atlas_locator?'<p class="meta">Roster locator attribution: Agent Memory Atlas provided the repository URL at '+esc(article.atlas_locator.revision)+'. Used only to identify this repository: '+webLink(article.atlas_locator.url,esc(article.atlas_locator.url))+'.</p>':'')+'</section>'+
 '<nav class="article-nav" aria-label="Article navigation"><a href="./index.html">← Catalog</a>'+nav+'</nav>';
}).catch(e=>{document.querySelector('#article').innerHTML='<p class="note">'+esc(e.message)+'</p>'});
</script></body></html>
