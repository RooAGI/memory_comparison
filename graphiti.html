<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graphiti · System article</title>
<style>
:root{color-scheme:light;--ink:#182522;--muted:#5d706a;--line:#dbe5df;--accent:#166653;--paper:#f6f8f5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif}main{width:min(1040px,calc(100% - 36px));margin:32px auto 72px}a{color:var(--accent);overflow-wrap:anywhere;text-underline-offset:3px}h1{font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.05;letter-spacing:-.04em;margin:.25em 0}h2{font-size:1.35rem;margin:0 0 12px}p{margin:.7em 0}.eyebrow,.meta{color:var(--muted);font-size:.92rem}.summary{font-size:1.12rem;max-width:72ch;color:#354843}.status{display:inline-block;padding:3px 10px;border-radius:999px;background:#e8f1eb;color:#355c4d;margin:4px 6px 4px 0}.notrun{background:#faf0d6;color:#775e19}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}.callout{border-left:4px solid #b68a27;background:#fff7e3;padding:12px 15px;border-radius:5px}.jump{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.jump a{background:white;border:1px solid var(--line);padding:6px 10px;border-radius:8px;text-decoration:none}.item{border-top:1px solid var(--line);padding:12px 0}.item:first-of-type{border-top:0}.item strong{display:block}.evidence{font-size:.9rem;color:var(--muted)}li{margin:.6em 0}code{overflow-wrap:anywhere}@media(max-width:600px){main{margin-top:18px}.panel{padding:15px}}
</style>
</head>
<body><main id="article"><p class="panel">Loading Graphiti article…</p></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('./data/graphiti.json').then(r=>{if(!r.ok)throw Error('Could not load article data');return r.json()}).then(({article:a})=>{
 const root=document.querySelector('#article');
 const src=id=>a.sources.find(s=>s.id===id);
 const refs=ids=>ids.map(id=>{const s=src(id);return s?'<a href="'+esc(s.url)+'">'+esc(s.label)+'</a>':esc(id)}).join('; ');
 const paras=rows=>rows.map(x=>'<div class="item"><p>'+esc(x.text)+'</p><div class="evidence">Sources: '+refs(x.sources||[])+'</div></div>').join('');
 document.title=a.name+' · System article';
 root.innerHTML='<nav><a href="./index.html">← System catalog</a></nav>'+
 '<header><p class="eyebrow">PROJECT SOURCE REVIEW · PINNED UPSTREAM REVISION</p><h1>'+esc(a.name)+'</h1><p class="summary">'+esc(a.summary)+'</p>'+
 '<p><span class="status">Reviewed from code</span><span class="status notrun">Benchmark not run</span></p>'+
 '<p class="meta">Repository: <a href="'+esc(a.repository)+'">'+esc(a.repository)+'</a> · default branch '+esc(a.branch)+' · reviewed '+esc(a.reviewed_at)+' · '+esc(a.review_timezone)+' · full commit <a href="'+esc(a.repository+'/commit/'+a.revision)+'"><code>'+esc(a.revision)+'</code></a></p></header>'+
 '<p class="callout"><strong>Source inspection is not benchmark measurement.</strong> This page describes code and documentation at one pinned revision. No Graphiti workload was run; measured quality, latency, tokens, cost, and storage results are unavailable.</p>'+
 '<nav class="jump" aria-label="Page sections">'+[['who','Who and what'],['architecture','Architecture'],['behavior','How it works'],['metrics','Metric evidence'],['limits','Limits and unknowns'],['benchmark','Benchmark status'],['sources','Sources']].map(x=>'<a href="#'+x[0]+'">'+esc(x[1])+'</a>').join('')+'</nav>'+
 '<section id="who" class="panel"><h2>Who and what</h2>'+paras(a.who_what)+'</section>'+
 '<section id="architecture" class="panel"><h2>Architecture and data model</h2>'+paras(a.architecture)+'</section>'+
 '<section id="behavior" class="panel"><h2>Write, update, delete, retrieval, scope, and evidence</h2>'+paras(a.behavior)+'</section>'+
 '<section id="metrics" class="panel"><h2>Metric-domain evidence</h2><p class="meta">Code observations describe available mechanisms. Only captured and adjudicated workload records can establish measured outcomes.</p>'+
 a.metrics.map(m=>'<div class="item"><strong>'+esc(m.domain)+' · '+esc(m.status)+'</strong><p>'+esc(m.evidence)+'</p><div class="evidence">Sources: '+refs(m.sources||[])+'</div></div>').join('')+'</section>'+
 '<section id="limits" class="panel"><h2>Limits and unknowns</h2>'+paras(a.limits)+'</section>'+
 '<section id="benchmark" class="panel"><h2>Benchmark status</h2>'+paras(a.benchmark)+'</section>'+
 '<section id="sources" class="panel"><h2>Sources</h2><ul>'+a.sources.map(s=>'<li><a href="'+esc(s.url)+'">'+esc(s.label)+'</a> <span class="meta">('+esc(s.path||'project source')+(s.symbol?' · '+esc(s.symbol):'')+')</span></li>').join('')+'</ul>'+
 '<p class="meta">Curated roster/repository locator attribution only: Agent Memory Atlas at revision '+esc(a.atlas_locator.revision)+' listed <a href="'+esc(a.atlas_locator.url)+'">this repository locator</a>. The assessment and capability marks were not used.</p></section>';
}).catch(e=>{document.querySelector('#article').innerHTML='<p class="panel">'+esc(e.message)+'</p>'});
</script></main></body></html>
