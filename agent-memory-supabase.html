<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Memory on Supabase · System article</title>
<style>
:root{color-scheme:light;--ink:#182522;--muted:#5d706a;--line:#dbe5df;--accent:#166653;--paper:#f6f8f5}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,sans-serif}
main{width:min(1040px,calc(100% - 36px));margin:36px auto 72px}a{color:var(--accent);text-underline-offset:3px;overflow-wrap:anywhere}
h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.08;letter-spacing:-.035em;margin:.25em 0}h2{margin:30px 0 8px;font-size:1.4rem}
.meta,.eyebrow{color:var(--muted);font-size:.92rem}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}
.status{display:inline-block;padding:3px 10px;border-radius:999px;background:#edf3ef;color:#355c4d;margin:4px 6px 4px 0}.notrun{background:#faf3dc;color:#775e19}
.summary{font-size:1.1rem;color:#354843}.note{border-left:3px solid #98bba9;background:#edf3ef;padding:12px 14px}
li{margin:8px 0}.metric{border-top:1px solid var(--line);padding:12px 0}.metric:first-child{border-top:0}
nav{display:flex;gap:12px;flex-wrap:wrap;padding:12px 0}nav a{padding:6px 10px;background:white;border:1px solid var(--line);border-radius:8px}
@media(max-width:600px){main{margin-top:20px}.panel{padding:14px}}
</style></head>
<body><main id="article"><p class="note">Loading system article…</p></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('./data/agent-memory-supabase.json').then(r=>{if(!r.ok)throw Error('Could not load article data');return r.json()}).then(({article:a})=>{
 const root=document.querySelector('#article'),src=id=>a.sources.find(s=>s.id===id);
 const refs=ids=>ids.map(id=>{const s=src(id);return s?'<a href="'+esc(s.url)+'">'+esc(s.label)+'</a>':esc(id)}).join('; ');
 const paras=items=>items.map(x=>'<p>'+esc(x.text)+' <span class="meta">Evidence: '+refs(x.sources||[])+'</span></p>').join('');
 const nav=['who','architecture','behavior','metrics','limits','benchmark','sources'];
 document.title=a.name+' · System article';
 root.innerHTML='<nav><a href="./index.html">← Catalog</a>'+nav.map(id=>'<a href="#'+id+'">'+esc(id)+'</a>').join('')+'</nav>'+
 '<header><p class="eyebrow">PROJECT SOURCE REVIEW · PINNED UPSTREAM REVISION</p><h1>'+esc(a.name)+'</h1><p class="summary">'+esc(a.summary)+'</p>'+
 '<p><span class="status">Reviewed from code</span><span class="status notrun">Benchmark not run</span></p>'+
 '<p class="meta">Repository: <a href="'+esc(a.repository)+'">'+esc(a.repository)+'</a> · default branch '+esc(a.branch)+' · reviewed '+esc(a.reviewed_at)+' '+esc(a.review_timezone)+' · commit <a href="'+esc(a.repository+'/commit/'+a.revision)+'"><code>'+esc(a.revision)+'</code></a></p></header>'+
 '<section id="who" class="panel"><h2>Who and what</h2>'+paras(a.who_what)+'</section>'+
 '<section id="architecture" class="panel"><h2>Architecture and data model</h2>'+paras(a.architecture)+'</section>'+
 '<section id="behavior" class="panel"><h2>Write, update, delete, and retrieval</h2>'+paras(a.behavior)+'</section>'+
 '<section id="metrics" class="panel"><h2>Metric-domain evidence</h2><p class="meta">Source observations describe code paths; they are not workload measurements.</p>'+a.metrics.map(m=>'<div class="metric"><strong>'+esc(m.domain)+'</strong> · '+esc(m.status)+'<p>'+esc(m.evidence)+'</p><span class="meta">Evidence: '+refs(m.sources||[])+'</span></div>').join('')+'</section>'+
 '<section id="limits" class="panel"><h2>Limits and unknowns</h2>'+paras(a.limits)+'</section>'+
 '<section id="benchmark" class="panel"><h2>Benchmark status</h2>'+paras(a.benchmark)+'</section>'+
 '<section id="sources" class="panel"><h2>Sources</h2><ul>'+a.sources.map(s=>'<li><a href="'+esc(s.url)+'">'+esc(s.label)+'</a> <span class="meta">('+esc(s.path||'project source')+(s.symbol?' · '+esc(s.symbol):'')+')</span></li>').join('')+'</ul>'+
 '<p class="meta">Atlas roster locator attribution at revision '+esc(a.atlas_locator.revision)+': <a href="'+esc(a.atlas_locator.url)+'">'+esc(a.atlas_locator.url)+'</a>. Used only to identify the ordinal roster entry and repository URL.</p></section>';
}).catch(e=>{document.querySelector('#article').innerHTML='<p class="note">'+esc(e.message)+'</p>'});
</script></main></body></html>
